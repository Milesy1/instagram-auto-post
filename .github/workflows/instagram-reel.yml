name: Instagram Reel Post

on:
  schedule:
    # Runs every 15 minutes; the script decides whether REEL_POST_INTERVAL
    # (24h) has elapsed since the last successful Reel post and exits
    # immediately if not. Same self-correcting pattern as the other two
    # workflows -- a frequent tick with an internal due-check survives
    # GitHub Actions occasionally delaying or dropping an exact-time trigger.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # allows manual triggering from the Actions tab for testing

jobs:
  post-reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (required to encode the animation to MP4)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check due / post Instagram Reel
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_to_instagram.py --auto-reel

      - name: Commit updated state (only if something was actually posted)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_quote.txt last_reel_post.txt
          git diff --staged --quiet || git commit -m "Update state after Reel post [skip ci]"
          git push
