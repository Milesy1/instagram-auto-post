name: Instagram Story Post

on:
  schedule:
    # Runs every 15 minutes; the script decides whether STORY_POST_INTERVAL
    # has elapsed since the last successful Story post and exits immediately
    # if not. Same rationale as instagram-post.yml -- a frequent tick with an
    # internal due-check is more reliable than a single fixed daily cron time,
    # since GitHub Actions occasionally delays or drops exact-time triggers.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # allows manual triggering from the Actions tab for testing

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check due / post Instagram Story
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
        run: python post_to_instagram.py --auto-story

      - name: Commit updated state (only if something was actually posted)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_images.log last_story_post.txt
          git diff --staged --quiet || git commit -m "Update used-images state [skip ci]"
          git push