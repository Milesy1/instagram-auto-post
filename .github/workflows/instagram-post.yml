name: Instagram Auto Post

on:
  schedule:
    # Times are in UTC. These correspond to roughly 8am, 11am, 2pm, 5pm, 8pm
    # UK time during BST (UTC+1). During GMT (winter), actual UK time will be
    # one hour later than intended -- adjust the cron times below if that matters.
    - cron: '0 7 * * *'
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:  # allows manual triggering from the Actions tab for testing
    inputs:
      source:
        description: 'Image source to use (leave blank for random)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - stability
          - met
          - nasa
          - artic
          - commons

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay (so posting time doesn't look robotically exact)
        if: github.event_name != 'workflow_dispatch'
        run: |
          DELAY=$((RANDOM % 3000))
          echo "Sleeping for $DELAY seconds"
          sleep $DELAY

      - name: Post to Instagram
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then
            python post_to_instagram.py "$SOURCE"
          else
            python post_to_instagram.py
          fi

      - name: Commit updated quote state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_quote.txt
          git diff --staged --quiet || git commit -m "Update last used quote [skip ci]"
          git push
