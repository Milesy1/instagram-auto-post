name: Instagram Auto Post

on:
  schedule:
    # Times are in UTC. These correspond to roughly 8am, 11am, 2pm, 5pm, 8pm
    # UK time during BST (UTC+1). During GMT (winter), actual UK time will be
    # one hour later than intended -- adjust the cron times below if that matters.
    - cron: '7 7 * * *'
    - cron: '13 10 * * *'
    - cron: '22 13 * * *'
    - cron: '38 16 * * *'
    - cron: '51 19 * * *'
  workflow_dispatch: {}  # allows manual triggering from the Actions tab for testing

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay (so posting time doesn't look robotically exact)
        run: |
          DELAY=$((RANDOM % 3000))
          echo "Sleeping for $DELAY seconds"
          sleep $DELAY

      - name: Post to Instagram
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
        run: python post_to_instagram.py

      - name: Commit updated quote and image-tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_quote.txt used_images.log
          git diff --staged --quiet || git commit -m "Update quote and used-images state [skip ci]"
          git push
