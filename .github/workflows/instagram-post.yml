name: Instagram Auto Post

on:
  schedule:
    # Runs every 15 minutes; the script itself decides whether enough time
    # has passed since the last successful post (see FEED_POST_INTERVAL in
    # post_to_instagram.py) and exits immediately if not. This replaces 5
    # fixed daily cron times, since GitHub Actions occasionally delays or
    # silently drops an exact-time schedule trigger -- with a frequent tick,
    # a dropped one just gets caught by the next tick a few minutes later
    # instead of losing that slot for the whole day.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # allows manual triggering from the Actions tab for testing

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check due / post to Instagram
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python post_to_instagram.py --auto

      - name: Commit updated state (only if something was actually posted)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_quote.txt used_images.log last_feed_post.txt
          git diff --staged --quiet || git commit -m "Update quote and used-images state [skip ci]"
          git push